
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Shop</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            color: #202943;
        }

        header {
            background: #202943;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #5865f2;
            padding: 12px 16px;
            border-radius: 8px;
        }

        main {
            padding: 30px 6%;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 14px #20294312;
        }

        .product img {
            display: block;
            width: 100%;
            height: 170px;
            object-fit: contain;
            background: #f7f8fc;
            border-radius: 10px;
        }

        .product h2 {
            font-size: 20px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
            color: #5865f2;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button {
            background: #5865f2;
            color: white;
            width: 100%;
        }

        #message {
            min-height: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Pixel Shop</h1>
        <a href="checkout.html">View Cart (<span id="cart-count">0</span>)</a>
    </header>

    <main>
        <h2>Gaming Essentials</h2>
        <p>Find your next favorite gaming accessory.</p>

        <div class="products" id="products"></div>
        <p id="message" aria-live="polite"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
